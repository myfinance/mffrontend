<p-sidebar [(visible)]="sidebarVisible">
    <label>Konto:</label>
    <p-dropdown [options]="accounts" [(ngModel)]="selectedAccount" optionLabel="description"
      placeholder="select a Account" (onChange)="onInstrumentChange($event)" />

    <p-button (click)="setMaxDateRange()">maximaler Betrachtungszeitraum</p-button>
    <br>
    <p-button (click)="setRange2LastMonth()">letzter Monat</p-button>
    <br>
    <label>Stichtag</label>
    <p-calendar [(ngModel)]="dateForAnalysis" (onSelect)="handleDateForAnalysisChanged($event)" dateFormat="dd.mm.yy" [showIcon]="true"></p-calendar>

    <label>Referenzstichtag</label>
    <p-calendar [(ngModel)]="referenceDate" (onSelect)="handleReferenceDateChanged($event)" dateFormat="dd.mm.yy" [showIcon]="true"></p-calendar>

    <label>Betrachtungszeitraum Cashflowanalysis</label>
    <p-calendar [(ngModel)]="rangeDates" selectionMode="range" (onSelect)="handleRangeDateChanged(rangeDates)" dateFormat="dd.mm.yy" [showIcon]="true"></p-calendar>


    <form [formGroup]="uploadForm">
  
      <div class="p-field">
        <p-fileUpload
        name="csvFile" 
        accept=".csv"
        [multiple]="false" 
        fileLimit="1"
        customUpload="true"
        (onSelect)="onFileSelected($event)"
        (onUpload)="upload()" 
        chooseLabel="Choose File"
        showUploadButton="false"
        [auto]="false"
      ></p-fileUpload>
      </div>
  
      <div class="p-dialog-footer">
        <button pButton type="button" label="Upload" [disabled]="!uploadForm.valid || !selectedFile" (click)="upload()">
        </button>
      </div>
    </form>

</p-sidebar>
<p-button (click)="sidebarVisible = true" icon="pi pi-calendar" [outlined]="true"></p-button>
