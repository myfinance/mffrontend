<p-table [value]="budgetDetails" selectionMode="single" [(selection)]="selectedInstrument" dataKey="businesskey"
    (onRowSelect)="onRowSelect($event)" [metaKeySelection]="false" [tableStyle]="{ 'min-width': '8rem'}"
    [styleClass]="'p-datatable-sm'">

    <ng-template pTemplate="header">
        <tr class="scaled-header">
            <th pSortableColumn="description" style="width:40%">
                <div class="flex items-center">
                    Description
                    <p-sortIcon field="description" />
                    <p-columnFilter type="text" field="description" display="menu" />
                </div>
            </th>
            <th pSortableColumn="value" style="width:20%">
                <div class="flex items-center">
                    Value
                    <p-sortIcon field="value" />
                    <p-columnFilter type="text" field="instrumentType" display="menu" />
                </div>
            </th>
            <th pSortableColumn="diff" style="width:20%">
                Diff
                <p-sortIcon field="diff" />
                <p-columnFilter type="text" field="active" display="menu" />
            </th>
            <th pSortableColumn="Typ" style="width:20%">
                <div class="flex items-center">
                    Typ
                    <p-sortIcon field="Typ" />
                    <p-columnFilter type="text" field="instrumentType" display="menu" />
                </div>
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
        <tr [pSelectableRow]="row" class="scaled-row">
            <td>{{ row.description }}</td>
            <td>{{ row.value }}</td>
            <td>{{ row.value - row.referenceValue }}</td>
            <td>{{ row.instrumentType }}</td>
        </tr>
    </ng-template>
</p-table>
