<form [formGroup]="inputForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="security">Security:</label>
      <select class="btn btn-primary dropdown-toggle" formControlName="security">
        <option class="mydropdown-item" [ngValue]="security" *ngFor="let security of securities">
          {{ security.description }}
        </option>
      </select>
    </div>
  
  
    <div class="form-group">
      <label>Datum des Preises:</label>
      <p-calendar formControlName="priceDate" dateFormat="dd.mm.yy" placeholder="Select a date"></p-calendar>
      <div *ngIf="
          !inputForm.controls.priceDate.valid &&
          inputForm.controls.priceDate.touched
    " class="p-error">
        Date is required
      </div>
    </div>
  
  

  
    <div class="form-group">
      <label>Value</label>
      <p-inputNumber formControlName="value" mode="decimal" locale="de-DE" [useGrouping]="true" [minFractionDigits]="2"
        [maxFractionDigits]="2" inputStyleClass="p-inputtext p-component p-element" placeholder="Enter a number" />
      <div *ngIf="
        !inputForm.controls.value.valid &&
        inputForm.controls.value.touched
    " class="p-error">
        Value is required
      </div>
    </div>

    <button class="btn btn-primary" type="submit">Insert</button>
  
  </form>

  <div *ngIf="eodPrices && eodPrices.prices">
    <p-table [value]="eodPrices.prices | keyvalue" [tableStyle]="{ 'min-width': '30rem' }" sortField="day" [sortOrder]="-1">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="key">
                    <div class="flex items-center">
                        Date
                        <p-sortIcon field="key" />
                        <p-columnFilter type="date" field="key" display="menu" />
                    </div>
                </th>
                <th pSortableColumn="value">
                    <div class="flex items-center">
                        Value
                        <p-sortIcon field="value" />
                        <p-columnFilter type="numeric" field="value" display="menu" />
                    </div>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-price>
            <tr>
                <td>{{ price.key | date:'dd.MM.yyyy' }}</td>
                <td>{{ price.value.value | currency:'EUR' }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
