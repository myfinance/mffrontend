<p-sidebar [(visible)]="sidebarVisible">
  <label>Fundametaldatenpflege für :</label>
  <form [formGroup]="form">
    <div class="button-row">
      <button class="btn btn-primary" (click)="save()" type="button">
        save
      </button>
    </div>
    <div class="form-group">
      <label>fiscalEndDate:</label>
      <p-calendar
        formControlName="fiscalEndDate"
        dateFormat="dd.mm.yy"
        placeholder="Select a date"
      ></p-calendar>
      <div
        *ngIf="
          !form.controls.fiscalEndDate.valid &&
          form.controls.fiscalEndDate.touched
        "
        class="p-error"
      >
        Date is required
      </div>
    </div>
    <div class="form-group">
      <label>Währung</label>
      <select
        class="btn btn-primary dropdown-toggle"
        formControlName="currency"
      >
        <option
          class="mydropdown-item"
          [ngValue]="currency"
          *ngFor="let currency of currencies"
        >
          {{ currency.description }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>expectedCashflowGrowth</label>
      <p-inputNumber
        formControlName="expectedCashflowGrowth"
        mode="decimal"
        locale="de-DE"
        [useGrouping]="true"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
      />
    </div>
    <div class="form-group">
      <label>avgMarktcapFreeCashflowRatio</label>
      <p-inputNumber
        formControlName="avgMarktcapFreeCashflowRatio"
        mode="decimal"
        locale="de-DE"
        [useGrouping]="true"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
      />
    </div>
    <div class="form-group">
      <label>sharesOutstanding</label>
      <p-inputNumber
        formControlName="sharesOutstanding"
        mode="decimal"
        locale="de-DE"
        [useGrouping]="true"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
      />
    </div>
    <div class="form-group">
      <label>revenue</label>
      <p-inputNumber
        formControlName="revenue"
        mode="decimal"
        locale="de-DE"
        [useGrouping]="true"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
      />
    </div>
    <div class="form-group">
      <label>capitalExpenditures</label>
      <p-inputNumber
        formControlName="capitalExpenditures"
        mode="decimal"
        locale="de-DE"
        [useGrouping]="true"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
      />
    </div>
    <div class="form-group">
      <label>operatingCashflow</label>
      <p-inputNumber
        formControlName="operatingCashflow"
        mode="decimal"
        locale="de-DE"
        [useGrouping]="true"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
      />
    </div>
    <div class="form-group">
      <label>netIncome</label>
      <p-inputNumber
        formControlName="netIncome"
        mode="decimal"
        locale="de-DE"
        [useGrouping]="true"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
      />
    </div>
    <p-divider />
    <p>Historische FCF</p>
    <div>
      <p>Jahr</p>
      <p-inputNumber
        formControlName="FCFYear"
        locale="de-DE"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
        [min]="2000"
        [max]="2150"
        [showButtons]="true"
        [useGrouping]="false"
      />
      <p>FCF:</p>
      <p-inputNumber
        formControlName="FCFhistory"
        locale="de-DE"
        inputStyleClass="p-inputtext p-component p-element"
        placeholder="Enter a number"
        [useGrouping]="true"
      />
      <button class="btn btn-primary" type="button" (click)="addFCFHist()">
        add
      </button>
      <button class="btn btn-primary" type="button" (click)="removeFCFHist()">
        removeSelected
      </button>
      <div class="card">
        <p-table
          [value]="histFCFs"
          selectionMode="single"
          [(selection)]="selectedHistFCF"
          dataKey="year"
          [metaKeySelection]="false"
          [tableStyle]="{ 'min-width': '10rem' }"
        >
          <ng-template pTemplate="header">
            <tr>
              <th>Jahr</th>
              <th>FCF</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-row>
            <tr [pSelectableRow]="row">
              <td>{{ row.year }}</td>
              <td>{{ row.value | number:'1.0-0' }}</td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </form>
</p-sidebar>
<p-button
  (click)="sidebarVisible = true"
  icon="pi pi-database"
  [outlined]="true"
></p-button>
