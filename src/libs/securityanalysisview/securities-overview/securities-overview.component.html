<div class="scrollable-container">

    <p-table [value]="instruments" selectionMode="single" [(selection)]="selectedInstrument" dataKey="businesskey"
        (onRowSelect)="onRowSelect($event)" [metaKeySelection]="false" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="description">
                    <div class="flex items-center">
                        Description
                        <p-sortIcon field="description" />
                        <p-columnFilter type="text" field="description" display="menu" />
                    </div>
                </th>
                <th pSortableColumn="value">
                    <div class="flex items-center">
                        Value
                        <p-sortIcon field="value" />
                        <p-columnFilter type="text" field="value" display="menu" />
                    </div>
                </th>
                <th pSortableColumn="referenceValue">
                    <div class="flex items-center">
                        referenceValue
                        <p-sortIcon field="referenceValue" />
                        <p-columnFilter type="text" field="referenceValue" display="menu" />
                    </div>
                </th>
                <th pSortableColumn="instrumentType">
                    <div class="flex items-center">
                        instrumentType
                        <p-sortIcon field="instrumentType" />
                        <p-columnFilter type="text" field="instrumentType" display="menu" />
                    </div>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
            <tr [pSelectableRow]="row">
                <td>{{ row.description }}</td>
                <td>{{ row.value }}</td>
                <td>{{ row.referenceValue }}</td>
                <td>{{ row.instrumentType }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
