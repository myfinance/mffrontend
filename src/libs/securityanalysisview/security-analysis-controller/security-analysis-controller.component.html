

<p-sidebar [(visible)]="sidebarVisible">

    <p-button (click)="importTimeSeriesWeekly4SelectedInstrument()">starte Zeitreihen für {{this.getSelectedInstrumentDesc()}}</p-button>
    <p-button (click)="importSecurityMetrics4SelectedInstrument()">starte Fundamentaldatenimport für {{this.getSelectedInstrumentDesc()}}</p-button>
    <p-button (click)="importPrevClose4SelectedInstrument()">starte Tagesendpreisimport für {{this.getSelectedInstrumentDesc()}}</p-button>
    <p-button (click)="importPrevClose()">starte Tagesendpreisimport</p-button>
    <label>Referenzstichtag</label>
    <p-calendar [(ngModel)]="referenceDate" (onSelect)="handleReferenceDateChanged($event)" dateFormat="dd.mm.yy" [showIcon]="true"></p-calendar>

    <label>Betrachtungszeitraum für historische Zeitreihen</label>
    <p-calendar [(ngModel)]="rangeDates" selectionMode="range" (onSelect)="handleRangeDateChanged(rangeDates)" dateFormat="dd.mm.yy" [showIcon]="true"></p-calendar>
</p-sidebar>
<p-button (click)="sidebarVisible = true" icon="pi pi-play" [outlined]="true"></p-button>
