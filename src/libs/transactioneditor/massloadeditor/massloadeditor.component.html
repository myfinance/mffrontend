<div *ngIf="content.length">
  <form
    [formGroup]="dynamicForm"
    (ngSubmit)="onSubmit()"
    *ngIf="content.length"
  >

    <p-button type="submit" label="Save" icon="pi pi-check"></p-button>

    <p-table
      [value]="rows.controls"
      formArrayName="rows"
      [scrollable]="true"
      scrollHeight="75vh"
      [style]="{ 'min-height': '75vh', 'max-height': '75vh' }"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Beschreibung</th>
          <th>Datum</th>
          <th>Betrag</th>
          <th>isTransfer</th>
          <th>Budget/Konto</th>
          <th>ignorieren</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
        <tr [formGroupName]="rowIndex">
          <td>
            <input
              pInputText
              formControlName="description"
              placeholder="Enter text"
            />
            <div
              *ngIf="
                rows.controls[rowIndex].get('description')?.invalid &&
                rows.controls[rowIndex].get('description')?.touched
              "
              class="p-error"
            >
              Text is required
            </div>
          </td>
          <td>
            <p-calendar
              formControlName="transactiondate"
              dateFormat="dd.mm.yy"
              placeholder="Select a date"
            ></p-calendar>
            <div
              *ngIf="
                rows.controls[rowIndex].get('transactiondate')?.invalid &&
                rows.controls[rowIndex].get('transactiondate')?.touched
              "
              class="p-error"
            >
              Date is required
            </div>
          </td>
          <td>
            <p-inputNumber
              formControlName="value"
              mode="decimal" 
              locale="de-DE" 
              [useGrouping]="true" 
              [minFractionDigits]="2"
              [maxFractionDigits]="2"
              inputStyleClass="p-inputtext p-component p-element"
              placeholder="Enter a number"
            />
            <div
              *ngIf="
                rows.controls[rowIndex].get('value')?.invalid &&
                rows.controls[rowIndex].get('value')?.touched
              "
              class="p-error"
            >
              Value is required
            </div>
          </td>
          <td>
            <p-checkbox
              formControlName="isTransfer"
              binary="true"
            ></p-checkbox>
          </td>
          <td>
            <ng-container *ngIf="!rows.controls[rowIndex].get('isTransfer')?.value; else giroDropdown">
              <p-dropdown
                formControlName="budgetOrGiro"
                [options]="budgets"
                optionLabel="description"
                placeholder="Select a Budget"
                [appendTo]="'body'"
              />
            </ng-container>
            
            <ng-template #giroDropdown>
              <p-dropdown
                formControlName="budgetOrGiro"
                [options]="giros"  
                optionLabel="description"
                placeholder="Select Giro"
                [appendTo]="'body'"
              />
            </ng-template>
            <div *ngIf="rows.controls[rowIndex].get('budgetOrGiro')?.invalid" class="p-error">
                Selection is required.
              </div>
        
          </td>
          <td>
            <p-inputSwitch formControlName="ignore" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </form>
</div>
