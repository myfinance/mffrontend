<form [formGroup]="transactionForm">


  <div class="form-group">
    <p>TransactionType:</p>
    <select class="btn btn-primary dropdown-toggle" formControlName="transactionType">
      <option class="mydropdown-item" [ngValue]="transactionType" *ngFor="let transactionType of transactionTypes">
        {{ transactionType }}
      </option>
    </select>
  </div>

  <div class="form-group"
    *ngIf="transactionForm.value.transactionType==='EXPENSE' || transactionForm.value.transactionType==='INCOME' 
    || transactionForm.value.transactionType==='BUDGETTRANSFER'|| transactionForm.value.transactionType==='TRANSFER'
    || transactionForm.value.transactionType==='LIFEINSURANCEEXPENSE'">
    <label>Beschreibung:</label>
    <input class="form-control" formControlName="description" />
    <span *ngIf="
        !transactionForm.controls.description.valid &&
        transactionForm.controls.description.touched
      ">
      Bitte geben Sie eine Beschreibung für die Transaction ein!
    </span>
  </div>



  <div class="form-group">
    <label>Transactionsdatum:</label>
    <p-calendar formControlName="transactionDate" dateFormat="dd.mm.yy" placeholder="Select a date"></p-calendar>
    <div *ngIf="
        !transactionForm.controls.transactionDate.valid &&
        transactionForm.controls.transactionDate.touched
  " class="p-error">
      Date is required
    </div>
  </div>


  <div class="form-group"
    *ngIf="transactionForm.value.transactionType!=='BUDGETTRANSFER'">
    <label>Quell-Konto</label>

    <select class="btn btn-primary dropdown-toggle" formControlName="srcAcc">
      <option class="mydropdown-item" [ngValue]="giro" *ngFor="let giro of giros">
        {{ giro.description }}
      </option>
    </select>
  </div>

  <div class="form-group"
    *ngIf="transactionForm.value.transactionType!=='TRANSFER'">
    <label>Quell-Budget</label>

    <select class="btn btn-primary dropdown-toggle" formControlName="srcBudget">
      <option class="mydropdown-item" [ngValue]="budget" *ngFor="let budget of budgets">
        {{ budget.description }}
      </option>
    </select>
  </div>

  <div class="form-group" *ngIf="transactionForm.value.transactionType==='TRANSFER'">
    <label>Ziel-Konto</label>
    <select class="btn btn-primary dropdown-toggle" formControlName="trgAcc">
      <option class="mydropdown-item" [ngValue]="giro" *ngFor="let giro of giros">
        {{ giro.description }}
      </option>
    </select>
  </div>

  <div class="form-group" *ngIf="transactionForm.value.transactionType==='BUDGETTRANSFER'">
    <label>Ziel-Budget</label>
    <select class="btn btn-primary dropdown-toggle" formControlName="trgBudget">
      <option class="mydropdown-item" [ngValue]="budget" *ngFor="let budget of budgets">
        {{ budget.description }}
      </option>
    </select>
  </div>

  <div class="form-group" *ngIf="transactionForm.value.transactionType==='BUY' || transactionForm.value.transactionType==='SELL' || transactionForm.value.transactionType==='DEPOTCASHFLOW'">
    <label>Depot</label>
    <select class="btn btn-primary dropdown-toggle" formControlName="depot">
      <option class="mydropdown-item" [ngValue]="depot" *ngFor="let depot of depots">
        {{ depot.description }}
      </option>
    </select>
  </div>

  <div class="form-group" *ngIf="transactionForm.value.transactionType==='BUY' || transactionForm.value.transactionType==='SELL' || transactionForm.value.transactionType==='DEPOTCASHFLOW'">
    <label>Security</label>
    <select class="btn btn-primary dropdown-toggle" formControlName="security">
      <option class="mydropdown-item" [ngValue]="security" *ngFor="let security of securities">
        {{ security.description }}
      </option>
    </select>
  </div>

  <div class="form-group" *ngIf="transactionForm.value.transactionType==='LIFEINSURANCEEXPENSE'">
    <label>Lebensversicherung</label>
    <select class="btn btn-primary dropdown-toggle" formControlName="lifeinsurance">
      <option class="mydropdown-item" [ngValue]="lifeinsurance" *ngFor="let lifeinsurance of lifeinsurances">
        {{ lifeinsurance.description }}
      </option>
    </select>
  </div>

  <div class="form-group" *ngIf="transactionForm.value.transactionType==='BUY' || transactionForm.value.transactionType==='SELL'">
      <label>Amount</label>
      <p-inputNumber formControlName="amount" mode="decimal" locale="de-DE" [useGrouping]="true" [minFractionDigits]="0"
        [maxFractionDigits]="8" inputStyleClass="p-inputtext p-component p-element" placeholder="Enter a number" />
  </div>

  <div class="form-group">
    <label>Value</label>
    <p-inputNumber formControlName="value" mode="decimal" locale="de-DE" [useGrouping]="true" [minFractionDigits]="2"
      [maxFractionDigits]="2" inputStyleClass="p-inputtext p-component p-element" placeholder="Enter a number" />
    <div *ngIf="
      !transactionForm.controls.value.valid &&
      transactionForm.controls.value.touched
  " class="p-error">
      Value is required
    </div>
  </div>


  <br>
  <div class="button-row">
    <button class="btn btn-primary" (click)="insertTransaction()" type="button">Insert</button>
    <button class="btn btn-primary" (click)="updateTransaction()" type="button"
      [disabled]="!transactionSelected">Update</button>
    <button class="btn btn-primary" (click)="deleteTransaction()" type="button"
      [disabled]="!transactionSelected">Delete</button>

  </div>

</form>
