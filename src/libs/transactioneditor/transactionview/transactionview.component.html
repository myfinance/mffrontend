<p-divider />
<p-sidebar [(visible)]="sidebarVisible" styleClass="p-sidebar-lg">

  <label>Betrachtungszeitraum:</label>
  <p-calendar [(ngModel)]="rangeDates" selectionMode="range" (onSelect)="handleRangeDateChanged(rangeDates)"
    dateFormat="dd.mm.yy" [showIcon]="true"></p-calendar>
  <label>Instrument:</label>
  <p-dropdown [options]="instruments" [(ngModel)]="instrumentFilter" optionLabel="description"
    placeholder="Filter an Instrument" (onChange)="onInstrumentChange($event)" />
  <p-divider />
  <p-button label="clearFilter" (onClick)="clearFilter()" />
</p-sidebar>
<p-button (click)="sidebarVisible = true" icon="pi pi-calendar" [outlined]="true"></p-button>





<div class="view-container">

  <br>
  <div class="scrollable-container">
    <p-table [value]="filteredTransactionViewObjects" 
        dataKey="transactionId" 
        selectionMode="single"
        [(selection)]="selectedTransaction" 
        (onRowSelect)="onRowSelect($event)" 
        (onRowUnselect)="onRowUnselect($event)" >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="transactiondate">
            <div class="flex items-center">
              transactiondate
              <p-sortIcon field="transactiondate" />
              <p-columnFilter type="text" field="transactiondate" display="menu" />
            </div>
          </th>
          <th pSortableColumn="value">
            <div class="flex items-center">
              value
              <p-sortIcon field="value" />
              <p-columnFilter type="text" field="value" display="menu" />
            </div>
          </th>
          <th>
            <div class="flex items-center">
              description
              <p-columnFilter type="text" field="description" display="menu" />
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr [pSelectableRow]="row">
          <td>{{ row.transactiondate | date:'yyyy-MM-dd' }}</td>
          <td>{{ row.value }}</td>
          <td>{{ row.description }}</td>
        </tr>
      </ng-template>

    </p-table>
  </div>
  <div>
